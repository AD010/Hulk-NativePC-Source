[hooks]
# Real Hulk guest function addresses from its compiled PPC->x64 mapping.
# PM4 DRAW_INDX and DRAW_INDX_2 make these candidates for the Draw family;
# exact high-level XDK signatures have not yet been matched.
# Real entrypoints verified by PowerPC guest calling conventions.
# DrawVertices: r3=device, r4=primitive, r5=startVertex, r6=vertexCount;
# actual PM4 DRAW_INDX and shader/constant flush in its function.
0x8288DF30=DrawVertices
# DrawIndexedVertices: device, prim, baseVertex, startIndex, indexCount.
0x8288E318=DrawIndexedVertices
# Resolve: device, flags, srcRect, destTexture, destPoint,
# mipLevel, slice, clearColor, float depth; emits RB_COPY/PM4, called by EndTiling.
0x828897F8=Resolve
# SetRenderTarget: device, RT index, surface; writes device+12440+4*index,
# and updates surface information / dirty-register bits.
0x8287F2C0=SetRenderTarget
# SetDepthStencilSurface: device, depth surface; writes device+12456.
0x8287F628=SetDepthStencilSurface
# BeginTiling: device, flags, count, tileRects, clearColor, depth, stencil.
0x8288A900=BeginTiling
# EndTiling: device, resolveFlags, resolveRects, destination, clearColor,
# float depth, stencil, params; calls Resolve per tile.
0x8288AD98=EndTiling
# Log 087: mapping outer 0x82880D10 to logical frame-end gave ZERO
# completed native frames and 256 MiB DiligentCore dynamic heap exhaustion.
# Prior log 079: 0x82880778 mapped to logical Present ended 31800 frames.
# Actual inner Swap r4 is the front-buffer object (sample 0xe2f3f000).
# Restore the observed logical frame-end; this still rendered black in
# log 079 and may run at ~400-500 FPS. Trace native resolved front.
0x82880778=Present
