# Hulk XDK 6534: observed command pointer and render-target/depth object
# fields from TWO separate user-supplied PPC images (EU and Bruce), and
# same D3D binary code confirmed in the pinned USA compilation.
# D3D draw/resolve/tiling calls below were identified by PPC call ABI.
# This profile ENABLES first native Vulkan frame testing, NOT parity.
# November 8 US rebuild: original-asset SHA gate and F10 PC overlay added.
# This line intentionally leaves the eight verified Vulkan hooks unchanged;
# the source changes must trigger ONE existing Windows Actions job.
# If native Vulkan displays an incomplete frame, record the log and continue
# correcting the remaining inferred shader/resource object fields.
[profile]
game=The Incredible Hulk (2008)
xdk_version=2.0.6534
experimental=0
output_width=1280
output_height=720

[device]
vs_constants_dirty=0
ps_constants_dirty=8
fetch_constants_dirty=24
fetch_dirty_slot0_bit=31
command_buffer_write=48
fetch_constants=1152
vs_float_constants=1920
ps_float_constants=6016
bool_loop_constants=10112
fence_counter=10908
write_back_block=10896
flags=10940
vertex_declaration=11820
index_buffer=12436
render_targets=12440
depth_stencil=12456
vertex_buffers=12460
textures=12544
viewport=12648
pixel_shader=12692
vertex_shader=12696
predication_mask=12708
tile_count=12748
tile_rects=12752
