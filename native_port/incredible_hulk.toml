game_data_root = ""
hulk_native_mnk = true
hulk_native_mnk_force = true
mnk_mode = false
hulk_mouse_sensitivity = 4.0
hulk_mouse_invert_y = false
hulk_mouse_diagnostics = false
vulkan_allow_present_mode_immediate = false
vulkan_allow_present_mode_mailbox = false
vulkan_allow_present_mode_fifo_relaxed = false
vsync = true
vblank_follows_display = false
# Preserve current game pacing until a 60Hz physics simulation is validated.
# 0 = no additional XDK submission cap; engine may still choose 30 FPS.
hulk_guest_swap_fps_cap = 0
user_country = 103
user_language = 1
render_target_path_vulkan = "fsi"
resolution_scale = 1
draw_resolution_scale_x = 1
draw_resolution_scale_y = 1
video_mode_width = 1280
video_mode_height = 720
window_width = 1280
window_height = 800
fullscreen = true
fullscreen_exclusive = false
present_letterbox = true
present_effect = "bilinear"
native_x_renderer = true
native_x_renderer_resolution_scale = 2.0
# Prefer sharper angled textures when the original asset has usable mips.
# NativeX honors the shared Xenos AF override only for eligible samplers:
# 4 = 8x AF, -1 = respect the game, 5 = 16x AF (more bandwidth).
# This cannot recover missing high-resolution source texels.
anisotropic_override = 4
# Log203 already captured raw texture-fetch/mip/LOD provenance; disable
# this per-draw diagnostic for normal gameplay. Re-enable only for a new
# targeted texture audit (it never changes texture or sampler values).
native_x_renderer_hulk_mip_probe = false
# Image presentation options; native resolution is NOT a texture upscaler.
# Sharpness 0 preserves the last known-good output. Try 0.10-0.20 via
# the F10 menu if desired. FSR 1/NIS are optional, DLSS view hooks are not
# yet validated in this game. These CVARs are startup-only.
native_x_renderer_scaling = "bilinear"
native_x_renderer_sharpness = 0.0
native_x_renderer_hulk_front_fallback = true
native_x_renderer_hulk_gap_single_draw = true
native_x_renderer_hulk_expand_msaa_sample_grid = true
native_x_renderer_hulk_full_output_scissor = true
native_x_renderer_hulk_auto_scene_aa = true
native_x_renderer_antialiasing = "smaa"
native_x_renderer_present_with_swaps = true
native_x_renderer_thread = true
hulk_native_x_verify_only = false
# HULK/RETAIL-CPU-BUDGET: the NativeX trace path captures per-frame D3D
# state. It is a diagnostic, not required for the native Vulkan render.
# Switch on explicitly for source-provenance investigations only.
native_x_renderer_trace = false
# Hulk gap replay requires the normal StateTracker::Enter boundaries.
native_x_renderer_lean_setters = false
native_x_renderer_trace_interval = 300
native_x_renderer_trace_dump_frames = 1
native_x_renderer_trace_dump_at = 900
# Observer compares GPU packets and CPU shadow state; off for retail
# performance while capture/verification remains opt-in.
native_x_renderer_verify = false
native_x_renderer_verify_frames = 1
native_x_renderer_verify_at = 900
bind_native_x_renderer_verify = "F11"
hulk_world_stream_trace = false
hulk_gpu_hook_probe = false
hulk_frame_probe = false
native_x_renderer_pipeline_storage = false
# Serialize NVIDIA Vulkan shader/PSO creation to reduce simultaneous driver compiler work.
# Experimental crash containment; does not fix invalid Xenos PM4 state.
native_x_renderer_hulk_serial_driver_creation = true
native_x_renderer_hulk_surface_fallback = false
# The original renderer silently skipped 1297 shader and 1098 pipeline
# draws by frame 1200 of build 67. Bounded D101 waits preserve scene draws.
# New shaders may briefly stall rather than leaving missing world pixels.
native_x_renderer_hulk_wait_scene_pipelines = true
native_x_renderer_wait_offscreen_pipelines = true
# Diagnostic only: true waits for EVERY shader/pipeline draw; can stall the GPU.
# Compare identical scenes to test if skipped compiling pipelines cause flicker.
native_x_renderer_skip_steady_passes = false
native_x_renderer_dynamic_rendering = true
native_x_renderer_pipeline_library = "auto"

# Windows-native saved-game package root, separated from original retail PC HULK.sav.
# OFF until migration from the previous Xbox XUID layout is verified.
hulk_native_pc_saves = false
