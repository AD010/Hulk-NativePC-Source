; Original Hulk (2008) PC, experimental 2560x1600 backbuffer only.
; NOT a HUD-safe preset: 4:3 menus/UI may be clipped or letterboxed.
; No FOV/projection modification. Gameplay and DXVK acceptance unverified.
; ProtectOriginalHUD=0 explicitly opts out of the default safety guard.
[Graphics]
ProtectOriginalHUD=0
ForceFullscreenWidth=2560
ForceFullscreenHeight=1600
ForceAnisotropy=16
EnableExperimentalViewProj16x10=0
BaseAspectNumerator=4
BaseAspectDenominator=3
