; Original Hulk (2008) PC, experimental 2560x1600 16:10 Hor+.
; NOT a HUD-safe preset: 4:3 menus/UI may be clipped or letterboxed.
; Only use for controlled testing; gameplay and DXVK acceptance unverified.
; ProtectOriginalHUD=0 explicitly opts out of the default safety guard.
[Graphics]
ProtectOriginalHUD=0
ForceFullscreenWidth=2560
ForceFullscreenHeight=1600
ForceAnisotropy=16
; Promote POINT mip sampling to LINEAR only on supported textures with mip chains.
ForceTrilinearMipFilter=1
EnableExperimentalViewProj16x10=1
; Experimental opt-in for depth-tested offscreen scene rendering.
ExperimentalHorPlusSceneTargets=1
BaseAspectNumerator=4
BaseAspectDenominator=3
