[Graphics]
; Safe default: original PC HUD/menu uses a 4:3 layout.
; While this is 1, the plugin deliberately ignores ForceFullscreenWidth,
; ForceFullscreenHeight and EnableExperimentalViewProj16x10.
; Set to 0 only for controlled visual experiments: the HUD can be clipped.
ProtectOriginalHUD=1

; These options are inactive while ProtectOriginalHUD=1.
ForceFullscreenWidth=0
ForceFullscreenHeight=0
EnableExperimentalViewProj16x10=0

; Texture filtering can be enabled independently of the HUD guard.
; 0=original, or 2/4/8/16 subject to the D3D9 device capability.
ForceAnisotropy=0

; Experimental mip filtering: promote POINT to LINEAR only when the driver
; reports support for 2D, cube and volume textures. Does not invent mipmaps,
; change 2D HUD geometry, or override an engine request for no mip filtering.
; Set to 1 for a controlled image-quality comparison; off by default.
ForceTrilinearMipFilter=0

; EXPERIMENTAL native-PC camera far-plane multiplier (1.0 = no hook).
; The exact original 2008 HULK.EXE stores CameraFarPlane at 004AC728.
; 1.0..2.0 only. Not a verified draw-distance or LOD improvement:
; geometry streaming and shadow cascades are separate. Restart required.
; Never combine with -noshadows to try to enable shadows.
ExperimentalCameraFarPlaneScale=1.0

; Source 3D projection aspect; not an override for the HUD aspect.
; The current plugin also reads BaseAspectNumerator/Denominator and those
; override SourceAspect when both are present.
SourceAspect=1.333333333333333
BaseAspectNumerator=4
BaseAspectDenominator=3
