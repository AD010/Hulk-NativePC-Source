name: Hulk NativePC - Manual Windows Release
on:
  # User directive 2026-11-21: do not start another failing Windows
  # Release while native EoR/Vulkan, in-game UI and actual source issues
  # remain unresolved. Preserve exactly ONE workflow, manual Release only.
  # The previous push marker remains archived as source history but it
  # must never trigger another build by an unrelated commit.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hulk-native-public-windows
  # Only the latest source revision should consume the Windows runner.
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'AD010/Hulk-NativePC-Source' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 330
    env:
      HULK_PINNED_XEX_SHA256: '346A73690303F6633BFDAF9850E78793FE07CDBFB8F849B89FBEE320630B11F0'
    steps:
      - name: Checkout public source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect public source for accidentally committed Xbox binaries
        shell: pwsh
        run: |
          python ci/check_public_source.py
          if ($LASTEXITCODE -ne 0) { throw 'PUBLIC SOURCE AUDIT FAILED: prohibited assets in Git' }
      - name: Diagnose previous private NativeX failure (redacted classification only)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.HULK_PRIVATE_REPO_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not $env:GH_TOKEN) { Write-Host '[HULK/LAST-FAIL] Unavailable'; exit 0 }
          $dir = Join-Path $env:RUNNER_TEMP 'hulk-previous-failure'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          gh release download hulk-ci-input-on-publish --repo AD010/hulk-cloud --pattern 'Hulk-PrivateRunner-Diagnostics.zip' --dir $dir --clobber *> $null
          if ($LASTEXITCODE -ne 0) { Write-Host '[HULK/LAST-FAIL] No private diagnosis'; exit 0 }
          try {
            Expand-Archive -LiteralPath (Join-Path $dir 'Hulk-PrivateRunner-Diagnostics.zip') -DestinationPath (Join-Path $dir 'read') -Force -ErrorAction Stop
            $file = Get-ChildItem (Join-Path $dir 'read') -Recurse -File | Where-Object { $_.Name -eq 'hulk-compiler-private.log' } | Select-Object -First 1
            if (-not $file) { Write-Host '[HULK/LAST-FAIL] No compiler file'; exit 0 }
            # Print only compiler error categories/codes and public source basenames.
            # Never expose private PPC generated code or raw compiler messages.
            python ci/test_report_hulk_compiler_failure.py
            if ($LASTEXITCODE -ne 0) { throw 'Redacted diagnostic reporter tests failed' }
            python ci/report_hulk_compiler_failure.py $file.FullName
            $lines = @(Get-Content -LiteralPath $file.FullName -Tail 550 -ErrorAction Stop)
            $class = 'other'; $script = 'unknown'
            foreach ($line in $lines) {
              if ($line -match 'ci[\\/](test_patch_native_x_hulk_[a-z_]+\.py|patch_native_x_hulk_[a-z_]+\.py)') { $script = $Matches[1] }
              if ($line -match '(AssertionError|unittest\.runner|FAILED \(failures)') { $class = 'source-test' }
              if ($line -match '(Traceback|ValueError|anchor mismatch|source drift|Partial Hulk)') { $class = 'python-anchor-or-transform' }
              if ($line -match '(error C[0-9]{4}|fatal error C[0-9]{4}|error:.*(member|identifier|undeclared|conversion))') { $class = 'cpp-compilation' }
              if ($line -match '(LINK : fatal error|LNK[0-9]{4})') { $class = 'linker' }
            }
            Write-Host "[HULK/LAST-FAIL] Class=$class LastPatchScript=$script"
          } catch { Write-Host '[HULK/LAST-FAIL] Unable to classify (private bytes withheld)' }
      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
      - name: Configure MSVC and clang-cl
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Preflight complete pinned NativeX patch chain before private build
        shell: pwsh
        run: |
          python ci/test_native_x_patch_chain.py
          if ($LASTEXITCODE -ne 0) { throw 'NativeX full patch chain preflight FAILED. No private game data used.' }
      - name: Verify NativeX D140 complete source adaptation and regression safety
        shell: pwsh
        run: |
          $sourceFailures = [System.Collections.Generic.List[string]]::new()
          python ci/test_native_x_patch_chain.py --d140
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_native_x_patch_chain.py --d140'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_native_x_patch_chain.py --d140' }
          python ci/test_report_hulk_compiler_failure.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_report_hulk_compiler_failure.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_report_hulk_compiler_failure.py' }
          python ci/test_patch_sdk_hulk_fps_probe.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_patch_sdk_hulk_fps_probe.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_patch_sdk_hulk_fps_probe.py' }
          python ci/test_hulk_us_gpu_defaults.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_hulk_us_gpu_defaults.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_hulk_us_gpu_defaults.py' }
          python ci/test_audit_hulk_sdk_services.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_audit_hulk_sdk_services.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_audit_hulk_sdk_services.py' }
          python ci/test_patch_sdk_upstream_v011_ppc.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_patch_sdk_upstream_v011_ppc.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_patch_sdk_upstream_v011_ppc.py' }
          python ci/test_audit_hulk_pc_middleware.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_audit_hulk_pc_middleware.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_audit_hulk_pc_middleware.py' }
          python ci/test_audit_hulk_fmod_owner_pair.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_audit_hulk_fmod_owner_pair.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_audit_hulk_fmod_owner_pair.py' }
          python ci/test_audit_hulk_gpu_load.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_audit_hulk_gpu_load.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_audit_hulk_gpu_load.py' }
          python ci/test_native_gpu_autodiag.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_native_gpu_autodiag.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_native_gpu_autodiag.py' }
          python ci/test_patch_sdk_hulk_thread_probe.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_patch_sdk_hulk_thread_probe.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_patch_sdk_hulk_thread_probe.py' }
          python ci/test_hulk_pc_menu.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_hulk_pc_menu.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_hulk_pc_menu.py' }
          # Check actual linked native EoR EXE units and the independent
          # model/geometry MSVC link command before downloading private XEX.
          python ci/test_hulk_native_eor_link_coverage.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_hulk_native_eor_link_coverage.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_hulk_native_eor_link_coverage.py' }
          # Synthetic-only PM4/header/shader-family test: no private XEX
          # and no game shader bytes are loaded into the source workspace.
          python tools/audit_hulk_shader_pm4_overlap.py --test
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('tools/audit_hulk_shader_pm4_overlap.py --test'); Write-Host '[HULK/PREFLIGHT-FAIL] tools/audit_hulk_shader_pm4_overlap.py --test' }
          python ci/test_audit_hulk_pc_x360_ui_assets.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_audit_hulk_pc_x360_ui_assets.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_audit_hulk_pc_x360_ui_assets.py' }
          # Assert the actual original Xbox pause-page serialized VM symbol
          # route before the private build. No proprietary OBJECTS.ARC is
          # required to execute this synthetic-only regression.
          python ci/test_audit_hulk_original_pause_ui_objects.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_audit_hulk_original_pause_ui_objects.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_audit_hulk_original_pause_ui_objects.py' }
          # Actual original USA EoR VM native state_r callback is
          # source-verified independently from genuine private PPC image.
          # The test uses only synthetic methods; never imports Xbox data.
          python ci/test_hulk_usa_pause_state_vm_dispatch.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_hulk_usa_pause_state_vm_dispatch.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_hulk_usa_pause_state_vm_dispatch.py' }
          python ci/test_audit_hulk_havok_pair.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_audit_hulk_havok_pair.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_audit_hulk_havok_pair.py' }
          python ci/test_hulk_eor_extract_named_assets.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_hulk_eor_extract_named_assets.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_hulk_eor_extract_named_assets.py' }
          python ci/test_hulk_shader_effect_bank.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_hulk_shader_effect_bank.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_hulk_shader_effect_bank.py' }
          python ci/test_hulk_xenos_aot.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_hulk_xenos_aot.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_hulk_xenos_aot.py' }
          # Native original ShaderEffects shader and material source-only verification.
          python ci/test_hulk_xenos_to_spirv.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_hulk_xenos_to_spirv.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_hulk_xenos_to_spirv.py' }
          python ci/test_hulk_spirv_resource_contract.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_hulk_spirv_resource_contract.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_hulk_spirv_resource_contract.py' }
          python ci/test_hulk_eor_xdk_callsite_crosswalk.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_hulk_eor_xdk_callsite_crosswalk.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_hulk_eor_xdk_callsite_crosswalk.py' }
          # Exact SHA-pinned original USA PPC XDK entry ABI + all eight
          # direct source callers; synthetic only, no private code/asset
          # bytes in public Windows jobs. Material/guest UI ABI not inferred.
          python ci/test_hulk_verify_original_usa_xdk_draw_abi.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_hulk_verify_original_usa_xdk_draw_abi.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_hulk_verify_original_usa_xdk_draw_abi.py' }
          python ci/test_hulk_usa_eor_shader_vtables.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_hulk_usa_eor_shader_vtables.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_hulk_usa_eor_shader_vtables.py' }
          python ci/test_hulk_usa_decal_guest_geometry_abi.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_hulk_usa_decal_guest_geometry_abi.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_hulk_usa_decal_guest_geometry_abi.py' }
          # Real source 92-byte EoR material-state selector -> two actual
          # original XDK shader setters. 19 PPC instruction signatures;
          # never claim it proves archived ShaderEffects PDB pass index.
          python ci/test_hulk_usa_eor_pass_stage_abi.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_hulk_usa_eor_pass_stage_abi.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_hulk_usa_eor_pass_stage_abi.py' }
          # Real original USA ShaderEffect::render-item virtual call:
          # 52 source-matched vtables, 22 distinct PPC functions,
          # PPC bctrl at 0x82642BD4, only LR 0x82642BD8 may bind
          # r3=this shader, r4=source render item, r5=context.
          # Item vtable+48 material source returns r27 (17 PPC checks),
          # not a guessed material hash or a ShaderEffects effect pass.
          python ci/test_hulk_usa_shader_render_item_dispatch_abi.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_hulk_usa_shader_render_item_dispatch_abi.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_hulk_usa_shader_render_item_dispatch_abi.py' }
          python ci/test_hulk_ghidra_xdk_crosscheck.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_hulk_ghidra_xdk_crosscheck.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_hulk_ghidra_xdk_crosscheck.py' }
          # Single source-only suite; real ReXGlue source anchors are
          # independently checked at each staged SDK patch in BUILD_WINDOWS.
          python ci/test_patch_sdk_hulk_xenia_edge.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_patch_sdk_hulk_xenia_edge.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_patch_sdk_hulk_xenia_edge.py' }
          python ci/test_patch_xenosrecomp_hulk_fetch.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_patch_xenosrecomp_hulk_fetch.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_patch_xenosrecomp_hulk_fetch.py' }
          python ci/test_patch_xenosrecomp_hulk_lod.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_patch_xenosrecomp_hulk_lod.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_patch_xenosrecomp_hulk_lod.py' }
          python ci/test_patch_xenosrecomp_hulk_gradients.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_patch_xenosrecomp_hulk_gradients.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_patch_xenosrecomp_hulk_gradients.py' }
          python ci/test_audit_hulk_eor_shader_coverage.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_audit_hulk_eor_shader_coverage.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_audit_hulk_eor_shader_coverage.py' }
          python ci/test_hulk_eor_effect_ledger.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_hulk_eor_effect_ledger.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_hulk_eor_effect_ledger.py' }
          python ci/test_hulk_eor_shader_reflection.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_hulk_eor_shader_reflection.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_hulk_eor_shader_reflection.py' }
          python ci/test_hulk_eor_shader_samplers.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_hulk_eor_shader_samplers.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_hulk_eor_shader_samplers.py' }
          # Full source-only pinned USA Xbox ShaderEffects census:
          # 2597 original PDB VS/PS pairs, 5194 unique shaders,
          # 4420 sampler declarations. No proprietary shader bytes in CI.
          python ci/test_hulk_verify_usa_original_shader_effects.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_hulk_verify_usa_original_shader_effects.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_hulk_verify_usa_original_shader_effects.py' }
          # Source-only original 5194-program virtual metadata fingerprint
          # generation from actual owner private 233-effect manifest shape.
          # Synthetic collision/corruption tests; original GPU code stays private.
          python ci/test_hulk_eor_virtual_shader_identity.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_hulk_eor_virtual_shader_identity.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_hulk_eor_virtual_shader_identity.py' }
          python ci/test_ghidra_hulk_ui_hash_xrefs.py
          if ($LASTEXITCODE -ne 0) { $sourceFailures.Add('ci/test_ghidra_hulk_ui_hash_xrefs.py'); Write-Host '[HULK/PREFLIGHT-FAIL] ci/test_ghidra_hulk_ui_hash_xrefs.py' }
          if ($sourceFailures.Count -gt 0) { throw ('Source preflight failed: ' + ($sourceFailures -join '; ')) }
          $cppFailures = [System.Collections.Generic.List[string]]::new()
          # Compile the real native C++ asset backend against the Windows
          # toolchain independently of RexGlue, Xenia and guest codegen.
          $nativeTest = Join-Path $env:RUNNER_TEMP 'hulk-eor-asset-test.exe'
          $cppArgs = @('/nologo', '/std:c++20', '/EHsc', '/W4', '/WX', '/utf-8',
                       "/Fe:$nativeTest", 'native_port/src/eor_archive.cpp',
                       'native_port/src/eor_ui_asset_catalog.cpp',
                       'native_port/src/eor_font_pack.cpp',
                       'ci/eor_archive_native_test.cpp')
          & cl.exe @cppArgs
          if ($LASTEXITCODE -ne 0) { $cppFailures.Add('Native C++ EoR asset backend failed MSVC compile') } else {
            & $nativeTest
            if ($LASTEXITCODE -ne 0) { $cppFailures.Add('Native C++ EoR endian/index/CRC/resource regression failed') }
          }
          # Source-only C++ loader for actual original 2008 PC EoR menu
          # TXFL wrapped DDS artwork: synthetic test only, no game bytes.
          $uiTest = Join-Path $env:RUNNER_TEMP 'hulk-eor-retail-menu-art-test.exe'
          $uiArgs = @('/nologo','/std:c++20','/EHsc','/W4','/WX','/utf-8',
                      "/Fe:$uiTest",'native_port/src/eor_archive.cpp',
                      'native_port/src/eor_ui_original_dds.cpp',
                      'ci/eor_ui_original_dds_test.cpp')
          & cl.exe @uiArgs
          if ($LASTEXITCODE -ne 0) { $cppFailures.Add('Hulk original 2008 UI decode failed MSVC compile') } else {
            & $uiTest
            if ($LASTEXITCODE -ne 0) { $cppFailures.Add('Original Hulk EoR PC UI decode regression failed') }
          }
          # Native original Xbox FMOD trailing catalog and type-safe event
          # metadata preservation, no real FMOD bytes in CI or public repo.
          $fmCatTest = Join-Path $env:RUNNER_TEMP 'hulk-eor-fmod-catalog-test.exe'
          $fmCatArgs = @('/nologo','/std:c++20','/EHsc','/W4','/WX','/utf-8',
                         "/Fe:$fmCatTest",'native_port/src/eor_archive.cpp',
                         'native_port/src/eor_fmod_catalog.cpp',
                         'ci/eor_fmod_catalog_test.cpp')
          & cl.exe @fmCatArgs
          if ($LASTEXITCODE -ne 0) { $cppFailures.Add('Original EoR FMOD event catalog failed MSVC compilation') } else {
            & $fmCatTest
            if ($LASTEXITCODE -ne 0) { $cppFailures.Add('Original FMOD trailing catalog/index/metadata regression failed') }
          }
          # Original FMOD FEV1 metadata and EoR resource identity, no
          # proprietary event data, no audio playback or FMOD DLL required.
          $fmodTest = Join-Path $env:RUNNER_TEMP 'hulk-eor-fmod-test.exe'
          $fmodArgs = @('/nologo','/std:c++20','/EHsc','/W4','/WX','/utf-8',
                        "/Fe:$fmodTest", 'native_port/src/eor_archive.cpp',
                        'native_port/src/eor_fmod_project.cpp',
                        'ci/eor_fmod_project_test.cpp')
          & cl.exe @fmodArgs
          if ($LASTEXITCODE -ne 0) { $cppFailures.Add('Original EoR FMOD Event parser failed MSVC compilation') } else {
            & $fmodTest
            if ($LASTEXITCODE -ne 0) { $cppFailures.Add('EoR FMOD FEV1/CRC event identity regression failed') }
          }
          # Real 2008 retail PC / Xbox CRC32+hash-table envelope reader.
          # Synthetic-only tests, no original user save bytes uploaded.
          $saveFmtTest = Join-Path $env:RUNNER_TEMP 'hulk-save-pc-format-test.exe'
          $saveFmtArgs = @('/nologo','/std:c++20','/EHsc','/W4','/WX','/utf-8',
                           "/Fe:$saveFmtTest",'native_port/src/native_pc_save_format.cpp',
                           'ci/native_pc_save_format_test.cpp')
          & cl.exe @saveFmtArgs
          if ($LASTEXITCODE -ne 0) { $cppFailures.Add('Retail PC/Xbox Hulk native save reader failed MSVC compile') } else {
            & $saveFmtTest
            if ($LASTEXITCODE -ne 0) { $cppFailures.Add('Retail PC/Xbox Hulk save CRC/field-table regression failed') }
          }
          # Havok 5.1 standalone PC/Xbox endian/index tests (synthetic only).
          $havokTest = Join-Path $env:RUNNER_TEMP 'hulk-eor-havok-packfile-test.exe'
          $havokArgs = @('/nologo', '/std:c++20', '/EHsc', '/W4', '/WX', '/utf-8',
                         "/Fe:$havokTest", 'native_port/src/eor_archive.cpp',
                         'native_port/src/eor_havok_packfile.cpp',
                         'ci/eor_havok_packfile_test.cpp')
          & cl.exe @havokArgs
          if ($LASTEXITCODE -ne 0) { $cppFailures.Add('Havok 5.1 native reader failed MSVC compilation') } else {
            & $havokTest
            if ($LASTEXITCODE -ne 0) { $cppFailures.Add('Havok 5.1 indexed packfile reader regression failed') }
          }
          # Original PC 10-profile and Xbox 9-profile font_clean layout:
          # tests use only synthetic data, never redistribute original fonts.
          $fontTest = Join-Path $env:RUNNER_TEMP 'hulk-eor-font-test.exe'
          $fontArgs = @('/nologo', '/std:c++20', '/EHsc', '/W4', '/WX', '/utf-8',
                        "/Fe:$fontTest", 'native_port/src/eor_font_pack.cpp',
                        'ci/eor_font_pack_test.cpp')
          & cl.exe @fontArgs
          if ($LASTEXITCODE -ne 0) { $cppFailures.Add('Original EoR font profile reader failed MSVC compile') } else {
            & $fontTest
            if ($LASTEXITCODE -ne 0) { $cppFailures.Add('Original EoR PC/Xbox font profile validation failed') }
          }
          # Atomic single-TOML game-data root persistence, with Unicode paths.
          $rootTest = Join-Path $env:RUNNER_TEMP 'hulk-asset-root-test.exe'
          $rootArgs = @('/nologo','/std:c++20','/EHsc','/W4','/WX','/utf-8',
                        "/Fe:$rootTest",
                        'native_port/src/native_game_data_root_store.cpp',
                        'ci/native_game_data_root_store_test.cpp')
          & cl.exe @rootArgs
          if ($LASTEXITCODE -ne 0) { $cppFailures.Add('Hulk asset-root writer failed MSVC compilation') } else {
            & $rootTest
            if ($LASTEXITCODE -ne 0) { $cppFailures.Add('Atomic Hulk game root TOML writer regression') }
          }
          # Host-native EoR draw contract, strictly independent of PM4 and
          # the 720p guest surface layout. Synthetic, no copyrighted payload.
          $frameTest = Join-Path $env:RUNNER_TEMP 'hulk-eor-native-frame-test.exe'
          $frameArgs = @('/nologo', '/std:c++20', '/EHsc', '/W4', '/WX', '/utf-8',
                         "/Fe:$frameTest", 'native_port/src/eor_native_frame.cpp',
                         'ci/eor_native_frame_test.cpp')
          & cl.exe @frameArgs
          if ($LASTEXITCODE -ne 0) { $cppFailures.Add('EoR host-native frame contract failed MSVC compilation') } else {
            & $frameTest
            if ($LASTEXITCODE -ne 0) { $cppFailures.Add('EoR native 2560x1600 / 16:9 fallback frame test failed') }
