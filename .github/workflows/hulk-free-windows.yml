name: Hulk NativePC - D140 Public Source-only Audit
on:
  push:
    branches:
      - ci/native-x-d140-migration
    paths:
      - ci/test_patch_native_x_hulk_d139_shader_memo.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-audit:
    if: github.repository == 'AD010/Hulk-NativePC-Source' && github.ref == 'refs/heads/ci/native-x-d140-migration'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate public sources
        uses: actions/checkout@v4
      - name: Verify public source before fetching NativeX
        run: python ci/check_public_source.py
      - name: Reapply every existing Hulk patch to NativeX D140 (source-only)
        run: python ci/test_native_x_patch_chain.py --d140
