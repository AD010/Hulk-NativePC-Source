name: Hulk NativePC - Free Public Windows Builder
on:
  # User-requested release gate: do not start more experimental Windows
  # builds on source edits. Keep this single Release-only workflow available
  # for an explicit final validation through GitHub Actions.
  workflow_dispatch:
  # One-shot USER-AUTHORIZED D140 integration build of owner FMOD catalog
  # and retail PC save envelope, then restore manual-only release workflow.
  push:
    branches: [main]
    paths:
      - native_port/docs/HULK_D140_LOG201_VISUAL_PERFORMANCE_2026-11-14.md
permissions:
  contents: write
concurrency:
  group: hulk-native-public-windows
  # Only the latest source revision should consume the Windows runner.
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'AD010/Hulk-NativePC-Source' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 330
    env:
      HULK_PINNED_XEX_SHA256: '346A73690303F6633BFDAF9850E78793FE07CDBFB8F849B89FBEE320630B11F0'
    steps:
      - name: Checkout public source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect public source for accidentally committed Xbox binaries
        shell: pwsh
        run: |
          python ci/check_public_source.py
          if ($LASTEXITCODE -ne 0) { throw 'PUBLIC SOURCE AUDIT FAILED: prohibited assets in Git' }
      - name: Diagnose previous private NativeX failure (redacted classification only)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.HULK_PRIVATE_REPO_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not $env:GH_TOKEN) { Write-Host '[HULK/LAST-FAIL] Unavailable'; exit 0 }
          $dir = Join-Path $env:RUNNER_TEMP 'hulk-previous-failure'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          gh release download hulk-ci-input-on-publish --repo AD010/hulk-cloud --pattern 'Hulk-PrivateRunner-Diagnostics.zip' --dir $dir --clobber *> $null
          if ($LASTEXITCODE -ne 0) { Write-Host '[HULK/LAST-FAIL] No private diagnosis'; exit 0 }
          try {
            Expand-Archive -LiteralPath (Join-Path $dir 'Hulk-PrivateRunner-Diagnostics.zip') -DestinationPath (Join-Path $dir 'read') -Force -ErrorAction Stop
            $file = Get-ChildItem (Join-Path $dir 'read') -Recurse -File | Where-Object { $_.Name -eq 'hulk-compiler-private.log' } | Select-Object -First 1
            if (-not $file) { Write-Host '[HULK/LAST-FAIL] No compiler file'; exit 0 }
            # Print only compiler error categories/codes and public source basenames.
            # Never expose private PPC generated code or raw compiler messages.
            python ci/test_report_hulk_compiler_failure.py
            if ($LASTEXITCODE -ne 0) { throw 'Redacted diagnostic reporter tests failed' }
            python ci/report_hulk_compiler_failure.py $file.FullName
            $lines = @(Get-Content -LiteralPath $file.FullName -Tail 550 -ErrorAction Stop)
            $class = 'other'; $script = 'unknown'
            foreach ($line in $lines) {
              if ($line -match 'ci[\\/](test_patch_native_x_hulk_[a-z_]+\.py|patch_native_x_hulk_[a-z_]+\.py)') { $script = $Matches[1] }
              if ($line -match '(AssertionError|unittest\.runner|FAILED \(failures)') { $class = 'source-test' }
              if ($line -match '(Traceback|ValueError|anchor mismatch|source drift|Partial Hulk)') { $class = 'python-anchor-or-transform' }
              if ($line -match '(error C[0-9]{4}|fatal error C[0-9]{4}|error:.*(member|identifier|undeclared|conversion))') { $class = 'cpp-compilation' }
              if ($line -match '(LINK : fatal error|LNK[0-9]{4})') { $class = 'linker' }
            }
            Write-Host "[HULK/LAST-FAIL] Class=$class LastPatchScript=$script"
          } catch { Write-Host '[HULK/LAST-FAIL] Unable to classify (private bytes withheld)' }
      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
      - name: Configure MSVC and clang-cl
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Preflight complete pinned NativeX patch chain before private build
        shell: pwsh
        run: |
          python ci/test_native_x_patch_chain.py
          if ($LASTEXITCODE -ne 0) { throw 'NativeX full patch chain preflight FAILED. No private game data used.' }
      - name: Verify NativeX D140 complete source adaptation and regression safety
        shell: pwsh
        run: |
          python ci/test_native_x_patch_chain.py --d140
          if ($LASTEXITCODE -ne 0) {
            throw 'NativeX D140 fa19ea85 full source patch integration FAILED; refusing private Windows build.'
          }
          python ci/test_report_hulk_compiler_failure.py
          if ($LASTEXITCODE -ne 0) { throw 'Redacted current-build diagnostics self-test failed' }
          python ci/test_patch_sdk_hulk_fps_probe.py
          if ($LASTEXITCODE -ne 0) { throw 'Hulk VdSwap cvar test failed' }
          python ci/test_hulk_us_gpu_defaults.py
          if ($LASTEXITCODE -ne 0) { throw 'USA game configuration test failed' }
          python ci/test_audit_hulk_sdk_services.py
          if ($LASTEXITCODE -ne 0) { throw 'ReXGlue XMA/XAM/VFS/thread source services audit regression failed' }
          python ci/test_audit_hulk_pc_middleware.py
          python ci/test_audit_hulk_fmod_owner_pair.py
          if ($LASTEXITCODE -ne 0) { throw 'Original FMOD 32bit DLL and USA event index comparison regression failed' }
          if ($LASTEXITCODE -ne 0) { throw 'Original Windows 2008 FMOD/Havok pure-PE audit regression failed' }
          python ci/test_audit_hulk_gpu_load.py
          if ($LASTEXITCODE -ne 0) { throw 'NativeX real GPU interval statistics parser regression failed' }
          python ci/test_patch_sdk_hulk_thread_probe.py
          if ($LASTEXITCODE -ne 0) { throw 'Read-only real guest thread/affinity CPU probe SDK patch regression failed' }
          python ci/test_hulk_pc_menu.py
          if ($LASTEXITCODE -ne 0) { throw 'Native PC menu regression failed' }
          # Synthetic-only PM4/header/shader-family test: no private XEX
          # and no game shader bytes are loaded into the source workspace.
          python tools/audit_hulk_shader_pm4_overlap.py --test
          if ($LASTEXITCODE -ne 0) { throw '27-word shader/PM4 provenance classifier regression failed' }
          python ci/test_audit_hulk_pc_x360_ui_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Original EoR UI archive/index regression failed (no game assets used)' }
          python ci/test_audit_hulk_havok_pair.py
          if ($LASTEXITCODE -ne 0) { throw 'Original user-indexed PC/Xbox Havok 5.1 section/fixup synthetic regression failed' }
          python ci/test_hulk_eor_extract_named_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Original EoR CRC32 named asset extractor regression failed (synthetic assets only)' }
          python ci/test_hulk_shader_effect_bank.py
          if ($LASTEXITCODE -ne 0) { throw 'Private X360 EoR effect bank extraction regression failed' }
          python ci/test_hulk_xenos_aot.py
          if ($LASTEXITCODE -ne 0) { throw 'Hulk XenosRecomp/DXC offline AOT toolchain regression failed' }
          python ci/test_ghidra_hulk_ui_hash_xrefs.py
          if ($LASTEXITCODE -ne 0) { throw 'Original pause-menu resource CRC32 cross-reference scanner regression failed' }
          # Compile the real native C++ asset backend against the Windows
          # toolchain independently of RexGlue, Xenia and guest codegen.
          $nativeTest = Join-Path $env:RUNNER_TEMP 'hulk-eor-asset-test.exe'
          $cppArgs = @('/nologo', '/std:c++20', '/EHsc', '/W4', '/WX', '/utf-8',
                       "/Fe:$nativeTest", 'native_port/src/eor_archive.cpp',
                       'native_port/src/eor_ui_asset_catalog.cpp',
                       'native_port/src/eor_font_pack.cpp',
                       'ci/eor_archive_native_test.cpp')
          & cl.exe @cppArgs
          if ($LASTEXITCODE -ne 0) { throw 'Native C++ EoR asset backend failed MSVC compile' }
          & $nativeTest
          if ($LASTEXITCODE -ne 0) { throw 'Native C++ EoR endian/index/CRC/resource regression failed' }
          # Native original Xbox FMOD trailing catalog and type-safe event
          # metadata preservation, no real FMOD bytes in CI or public repo.
          $fmCatTest = Join-Path $env:RUNNER_TEMP 'hulk-eor-fmod-catalog-test.exe'
          $fmCatArgs = @('/nologo','/std:c++20','/EHsc','/W4','/WX','/utf-8',
                         "/Fe:$fmCatTest",'native_port/src/eor_archive.cpp',
                         'native_port/src/eor_fmod_catalog.cpp',
                         'ci/eor_fmod_catalog_test.cpp')
          & cl.exe @fmCatArgs
          if ($LASTEXITCODE -ne 0) { throw 'Original EoR FMOD event catalog failed MSVC compilation' }
          & $fmCatTest
          if ($LASTEXITCODE -ne 0) { throw 'Original FMOD trailing catalog/index/metadata regression failed' }
          # Original FMOD FEV1 metadata and EoR resource identity, no
          # proprietary event data, no audio playback or FMOD DLL required.
          $fmodTest = Join-Path $env:RUNNER_TEMP 'hulk-eor-fmod-test.exe'
          $fmodArgs = @('/nologo','/std:c++20','/EHsc','/W4','/WX','/utf-8',
                        "/Fe:$fmodTest", 'native_port/src/eor_archive.cpp',
                        'native_port/src/eor_fmod_project.cpp',
                        'ci/eor_fmod_project_test.cpp')
          & cl.exe @fmodArgs
          if ($LASTEXITCODE -ne 0) { throw 'Original EoR FMOD Event parser failed MSVC compilation' }
          & $fmodTest
          if ($LASTEXITCODE -ne 0) { throw 'EoR FMOD FEV1/CRC event identity regression failed' }
          # Real 2008 retail PC / Xbox CRC32+hash-table envelope reader.
          # Synthetic-only tests, no original user save bytes uploaded.
          $saveFmtTest = Join-Path $env:RUNNER_TEMP 'hulk-save-pc-format-test.exe'
          $saveFmtArgs = @('/nologo','/std:c++20','/EHsc','/W4','/WX','/utf-8',
                           "/Fe:$saveFmtTest",'native_port/src/native_pc_save_format.cpp',
                           'ci/native_pc_save_format_test.cpp')
          & cl.exe @saveFmtArgs
          if ($LASTEXITCODE -ne 0) { throw 'Retail PC/Xbox Hulk native save reader failed MSVC compile' }
          & $saveFmtTest
          if ($LASTEXITCODE -ne 0) { throw 'Retail PC/Xbox Hulk save CRC/field-table regression failed' }
          # Havok 5.1 standalone PC/Xbox endian/index tests (synthetic only).
          $havokTest = Join-Path $env:RUNNER_TEMP 'hulk-eor-havok-packfile-test.exe'
          $havokArgs = @('/nologo', '/std:c++20', '/EHsc', '/W4', '/WX', '/utf-8',
                         "/Fe:$havokTest", 'native_port/src/eor_archive.cpp',
                         'native_port/src/eor_havok_packfile.cpp',
                         'ci/eor_havok_packfile_test.cpp')
          & cl.exe @havokArgs
          if ($LASTEXITCODE -ne 0) { throw 'Havok 5.1 native reader failed MSVC compilation' }
          & $havokTest
          if ($LASTEXITCODE -ne 0) { throw 'Havok 5.1 indexed packfile reader regression failed' }
          # Original PC 10-profile and Xbox 9-profile font_clean layout:
          # tests use only synthetic data, never redistribute original fonts.
          $fontTest = Join-Path $env:RUNNER_TEMP 'hulk-eor-font-test.exe'
          $fontArgs = @('/nologo', '/std:c++20', '/EHsc', '/W4', '/WX', '/utf-8',
                        "/Fe:$fontTest", 'native_port/src/eor_font_pack.cpp',
                        'ci/eor_font_pack_test.cpp')
          & cl.exe @fontArgs
          if ($LASTEXITCODE -ne 0) { throw 'Original EoR font profile reader failed MSVC compile' }
          & $fontTest
          if ($LASTEXITCODE -ne 0) { throw 'Original EoR PC/Xbox font profile validation failed' }
          # Atomic single-TOML game-data root persistence, with Unicode paths.
          $rootTest = Join-Path $env:RUNNER_TEMP 'hulk-asset-root-test.exe'
          $rootArgs = @('/nologo','/std:c++20','/EHsc','/W4','/WX','/utf-8',
                        "/Fe:$rootTest",
                        'native_port/src/native_game_data_root_store.cpp',
                        'ci/native_game_data_root_store_test.cpp')
          & cl.exe @rootArgs
          if ($LASTEXITCODE -ne 0) { throw 'Hulk asset-root writer failed MSVC compilation' }
          & $rootTest
          if ($LASTEXITCODE -ne 0) { throw 'Atomic Hulk game root TOML writer regression' }
          # Host-native EoR draw contract, strictly independent of PM4 and
          # the 720p guest surface layout. Synthetic, no copyrighted payload.
          $frameTest = Join-Path $env:RUNNER_TEMP 'hulk-eor-native-frame-test.exe'
          $frameArgs = @('/nologo', '/std:c++20', '/EHsc', '/W4', '/WX', '/utf-8',
                         "/Fe:$frameTest", 'native_port/src/eor_native_frame.cpp',
                         'ci/eor_native_frame_test.cpp')
          & cl.exe @frameArgs
          if ($LASTEXITCODE -ne 0) { throw 'EoR host-native frame contract failed MSVC compilation' }
          & $frameTest
          if ($LASTEXITCODE -ne 0) { throw 'EoR native 2560x1600 / 16:9 fallback frame test failed' }
          # Real USA XDK call provenance observer (no guest writes, no GPU redirection).
          python ci/test_gen_native_x_hooks_probe.py
          if ($LASTEXITCODE -ne 0) { throw 'Hulk verified XDK wrapper generator regression failed' }
          python ci/test_hulk_eor_xdk_observer_only.py
          if ($LASTEXITCODE -ne 0) { throw 'Hulk observer-only Xenos and real XDK call-through regression failed' }
          $xdkTest = Join-Path $env:RUNNER_TEMP 'hulk-eor-xdk-capture-test.exe'
          $xdkArgs = @('/nologo', '/std:c++20', '/EHsc', '/W4', '/WX', '/utf-8',
                       "/Fe:$xdkTest", 'native_port/src/eor_xdk_draw_capture.cpp',
                       'ci/eor_xdk_draw_capture_test.cpp')
          & cl.exe @xdkArgs
          if ($LASTEXITCODE -ne 0) { throw 'Native EoR verified XDK capture test failed MSVC compile' }
          & $xdkTest
          if ($LASTEXITCODE -ne 0) { throw 'Original XDK Draw capture regression failed' }
          # Verify runtime indexing of real AOT Vulkan modules by SHA-256;
          # no generated copyrighted shader contents in public source tests.
          $bankTest = Join-Path $env:RUNNER_TEMP 'hulk-eor-spv-bank-test.exe'
          $bankArgs = @('/nologo', '/std:c++20', '/EHsc', '/W4', '/WX', '/utf-8',
                        "/Fe:$bankTest", 'native_port/src/eor_spirv_bank.cpp',
                        'ci/eor_spirv_bank_test.cpp')
          & cl.exe @bankArgs
          if ($LASTEXITCODE -ne 0) { throw 'Private AOT SPIR-V bank reader failed MSVC compile' }
          & $bankTest
          if ($LASTEXITCODE -ne 0) { throw 'AOT Vulkan shader SHA index/bounds check failed' }
          # Real SPIR-V bank -> EoR indexed draw pair and source identity gate.
          $aotDrawTest = Join-Path $env:RUNNER_TEMP 'hulk-eor-aot-draw-test.exe'
          $aotDrawArgs = @('/nologo', '/std:c++20', '/EHsc', '/W4', '/WX', '/utf-8',
                           "/Fe:$aotDrawTest", 'native_port/src/eor_native_frame.cpp',
                           'native_port/src/eor_spirv_bank.cpp',
                           'native_port/src/eor_aot_draw_bridge.cpp',
                           'ci/eor_aot_draw_bridge_test.cpp')
          & cl.exe @aotDrawArgs
          if ($LASTEXITCODE -ne 0) { throw 'EoR AOT shader/pipeline binding bridge failed MSVC compile' }
          & $aotDrawTest
          if ($LASTEXITCODE -ne 0) { throw 'EoR Draw/VS/PS binding safety regression failed' }
          # Verify user settings can be saved in the ONE existing TOML,
          # with no fake F4 Save, duplicate keys or unwanted developer files.
          $optionTest = Join-Path $env:RUNNER_TEMP 'hulk-native-settings-test.exe'
          $optionArgs = @('/nologo', '/std:c++20', '/EHsc', '/W4', '/WX', '/utf-8',
                          "/Fe:$optionTest", 'native_port/src/native_pc_options_store.cpp',
                          'ci/native_pc_options_store_test.cpp')
          & cl.exe @optionArgs
          if ($LASTEXITCODE -ne 0) { throw 'Native PC TOML settings backend failed MSVC compile' }
          & $optionTest
          if ($LASTEXITCODE -ne 0) { throw 'Native PC single-TOML persistence regression failed' }
          Write-Host '[HULK/D140] Full source adaptation, native EoR resources and persistent PC menu settings verified.'
      - name: Get original input ONLY from private Hulk release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.HULK_PRIVATE_REPO_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:GH_TOKEN) { throw 'Set HULK_PRIVATE_REPO_TOKEN in this PUBLIC repository Actions secrets; token must access PRIVATE AD010/hulk-cloud (Contents read/write).' }
          New-Item -ItemType Directory -Path native_port/game -Force | Out-Null
          gh release download hulk-ci-input-on-publish --repo AD010/hulk-cloud --pattern default.xex --dir native_port/game --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Private XEX download failed. Check PAT permissions and release asset.' }
          $actual = (Get-FileHash native_port/game/default.xex -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actual -ne $env:HULK_PINNED_XEX_SHA256) { throw "Source XEX fingerprint does not match verified USA codegen: $actual" }
          Write-Host 'Private source XEX fingerprint verified. No Xbox binaries will be uploaded to public artifacts.'
      - name: Verify XDK metadata, and prepare validated PPC recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python ci/test_audit_hulk_xex_xdk.py
          if ($LASTEXITCODE -ne 0) { throw 'XEX metadata tests failed' }
          python ci/audit_hulk_xex_xdk.py native_port/game/default.xex --expected-sha256 $env:HULK_PINNED_XEX_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'XEX 6534 verification failed' }
          python ci/test_prepare_hulk_tu1_stage.py
          if ($LASTEXITCODE -ne 0) { throw 'EU TU1 source-stage test failed' }
          python ci/check_hulk_tu1_xex.py native_port/game/default.xex
          if ($LASTEXITCODE -ne 0) { throw 'TU1 compatibility check failed' }
          python ci/seed_hulk_ppc_tails.py native_port/missing_funcs.toml native_port/indirect_funcs.toml
          if ($LASTEXITCODE -ne 0) { throw 'Guest PPC hook preflight failed' }
          python ci/patch_codegen_retry.py native_port/BUILD_WINDOWS.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PPC codegen recovery patch failed' }
      - name: Compile Vulkan NativeXRenderer Hulk under Windows (PRIVATE diagnostic logs)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Write-Host 'Building Hulk on free Windows runner; compiler output kept off PUBLIC Actions logs.'
          # Do not echo compiler / PPC codegen messages into a public job log.
          $log = Join-Path $env:RUNNER_TEMP 'hulk-compiler-private.log'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File native_port/BUILD_WINDOWS.ps1 -GameRoot "$env:GITHUB_WORKSPACE/native_port/game" -NativeXLink *> $log
          $rc = $LASTEXITCODE
          New-Item -ItemType Directory -Force -Path native_port/out | Out-Null
          Copy-Item -LiteralPath $log -Destination native_port/out/hulk-compiler-private.log -Force
          if ($rc -ne 0) {
            # The current failed build has its own diagnostics. Publish only
            # bounded error C/LNK codes, whitelisted public script basenames
            # and unittest case names; never a generated PPC line or XEX.
            python ci/report_hulk_compiler_failure.py $log
            throw "Windows NativeX build failed (exit $rc). Full diagnostics are delivered to the PRIVATE release, not public logs."
          }
          if (-not (Test-Path native_port/out/HULK_NATIVE_PC_TEST/incredible_hulk.exe)) { throw 'Compiled EXE absent; see private diagnostics.' }
      - name: Publish engine render call graph privately (addresses only)
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.HULK_PRIVATE_REPO_TOKEN }}
        run: |
          # This source-only audit is not a shader/asset dump. Preserve just
          # the highest-level call relationships for Ghidra/IDA cross-check.
          $source = 'native_port/out/analysis/hulk_engine_render_callgraph.json'
          if (-not (Test-Path -LiteralPath $source)) {
            Write-Host '[HULK/CALLGRAPH] No report yet (codegen or XDK audit did not complete)'
            exit 0
          }
          if (-not $env:GH_TOKEN) {
            Write-Host '[HULK/CALLGRAPH] No private token; report stays on runner'
            exit 0
          }
          $destination = Join-Path $env:RUNNER_TEMP 'Hulk-EngineRender-Callgraph.json'
          Copy-Item -LiteralPath $source -Destination $destination -Force
          gh release upload hulk-ci-input-on-publish $destination --repo AD010/hulk-cloud --clobber *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host '[HULK/CALLGRAPH] Updated single PRIVATE source-only callgraph report'
          } else {
            Write-Host '[HULK/CALLGRAPH] Private report upload unavailable; game build unaffected'
          }
      - name: Verify source-free output ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path native_port/out/HULK_NATIVE_PC_TEST/* -DestinationPath artifacts/Hulk-NativePC-Vulkan.zip -Force
          python ci/verify_hulk_release.py artifacts/Hulk-NativePC-Vulkan.zip
          if ($LASTEXITCODE -ne 0) { throw 'ZIP verification failed' }
      - name: Deliver game ZIP to PRIVATE GitHub release, not public artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.HULK_PRIVATE_REPO_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:GH_TOKEN) { throw 'Missing private release token' }
          # Preserve the previous, user-tested Xenos-fallback build: never
          # replace Hulk-NativePC-Vulkan.zip with a new untested native GPU build.
          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          $versioned = "artifacts/Hulk-NativePC-Vulkan-PresentFix-$shortSha.zip"
          Copy-Item -LiteralPath 'artifacts/Hulk-NativePC-Vulkan.zip' -Destination $versioned -Force
          gh release upload hulk-ci-input-on-publish $versioned --repo AD010/hulk-cloud
          if ($LASTEXITCODE -ne 0) { throw 'Unable to upload versioned ZIP to PRIVATE release; requires Contents read/write.' }
          $digest = (Get-FileHash -LiteralPath $versioned -Algorithm SHA256).Hash
          Write-Host "Private release asset: Hulk-NativePC-Vulkan-PresentFix-$shortSha.zip"
          Write-Host "ZIP SHA256: $digest"
          Write-Host 'Previous private Hulk-NativePC-Vulkan.zip remains unchanged.'
          Write-Host 'No public downloadable game artifact or guest PPC sources were uploaded.'
      - name: Save failure diagnostics privately (never public artifacts)
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.HULK_PRIVATE_REPO_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { Write-Host 'No token available to save private diagnostic'; exit 0 }
          $files = @('native_port/out/hulk-compiler-private.log', 'native_port/HULK_BUILD_LOG.txt') | Where-Object { Test-Path $_ }
          if ($files.Count -eq 0) { Write-Host 'No private compiler output captured'; exit 0 }
          $zip = Join-Path $env:RUNNER_TEMP 'Hulk-PrivateRunner-Diagnostics.zip'
          Compress-Archive -Path $files -DestinationPath $zip -Force
          gh release upload hulk-ci-input-on-publish $zip --repo AD010/hulk-cloud --clobber
          if ($LASTEXITCODE -ne 0) { Write-Host 'Could not upload diagnostics to private release' }
          else { Write-Host 'Saved compiler diagnostics to private hulk-cloud release' }
      # Intentionally NO actions/upload-artifact, NO actions/cache and NO public release.
      # Generated PPC and proprietary input exist only in this ephemeral runner.
      # Cleanup is only after verified private publication and is nonfatal.
      - name: Prune merged Hulk temporary branches
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $names = @('hulk-2026-11-08-city-lod-trace',
                     'hulk-2026-11-08-f10-native-diagnostics',
                     'hulk-2026-11-08-heap-guard',
                     'hulk-2026-11-08-native-front-resolve',
                     'hulk-2026-11-08-present-abi-fix',
                     'hulk-2026-11-08-us-assets-fifo')
          foreach ($name in $names) {
            $j = gh api "repos/$env:GITHUB_REPOSITORY/compare/$name...main" 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $j) { Write-Host "Skipped $name"; continue }
            try { $x = $j | ConvertFrom-Json }
            catch { Write-Host "Invalid compare for $name"; continue }
            if ([int]$x.behind_by -ne 0) { Write-Host "Unmerged $name preserved"; continue }
            gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/heads/$name" 2>$null
            if ($LASTEXITCODE -eq 0) { Write-Host "Removed merged $name" }
            else { Write-Host "Could not remove $name (token or protection)" }
          }
          # Best-effort cleanup: a missing temporary branch makes gh exit 1.
