name: Hulk NativePC - D140 Source-only Compatibility Audit
on:
  push:
    branches: [ci/native-x-d140-migration]
    paths:
      - native_port/docs/NATIVEX_D140_MIGRATION_2026-11-13.md
permissions:
  contents: read
jobs:
  source-only-audit:
    if: github.repository == 'AD010/Hulk-NativePC-Source' && github.ref == 'refs/heads/ci/native-x-d140-migration'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify source-only repository
        run: python ci/check_public_source.py
      - name: Audit D140 against full Hulk native patch chain, no proprietary inputs
        run: python ci/test_native_x_patch_chain.py --d140
